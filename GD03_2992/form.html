<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Silvanus</title>
</head>
<body>
    <a href="profil.html">PROFIL</a>
    <br>
    <a href="interaktif.html">INTERAKTIF</a>
    <br><br>

    <form>
        <!-- NAMA (TEXT) -->
        <label for="inputNama">Nama:</label> <br>
        <input type="text" id="inputNama" name="nama">
        <br><br>

        <!-- JENIS KELAMIN (RADIO) -->
        <label>Jenis Kelamin:</label> <br>
        <input type="radio" id="inputLaki" name="jenis_kelamin" value="Laki-laki">
        <label for="inputLaki">Laki-laki</label>
        <br>
        <input type="radio" id="inputPerempuan" name="jenis_kelamin" value="Perempuan">
        <label for="inputPerempuan">Perempuan</label>
        <br><br>

        <!-- PRODI (SELECT) -->
        <label for="inputProdi">Program Studi:</label><br>
        <select id="inputProdi" name="prodi">
            <option value="informatika">Informatika</option>
            <option value="sistem_informasi">Sistem Informasi</option>
            <option value="teknik_industri">Teknik Industri</option>
        </select>
        <br><br>

        <!-- EMAIL -->
        <label for="inputEmail">Email:</label><br>
        <input type="email" id="inputEmail" name="email">
        <br><br>

        <!-- SUBMIT BTN -->
        <input type="submit" value="Kirim">
    </form>

</body>
</html>
