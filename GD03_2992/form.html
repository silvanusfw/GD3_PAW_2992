<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Silvanus</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header-profil">
        <h1 class="judul-header">FORM SILVANUS</h1>
        <nav aria-label="Navigasi utama">
            <a href="profil.html" onclick="return confirm('Yakin pergi ke halaman Profil?')">PROFIL</a>
            <a href="form.html">FORM</a>
            <a href="interaktif.html" onclick="return confirm('Yakin pergi ke halaman Interaktif?')">INTERAKTIF</a>
        </nav>
    </header>

    <main class="konten-halaman">
        <form class="form-card">
        <!-- NAMA (TEXT) -->
        <label for="inputNama">Nama:</label> <br>
        <input type="text" id="inputNama" name="nama" placeholder="Masukkan Nama">
        <br><br>

        <!-- JENIS KELAMIN (RADIO) -->
        <label>Jenis Kelamin:</label> <br>
        <input type="radio" id="inputLaki" name="jenis_kelamin" value="Laki-laki">
        <label for="inputLaki">Laki-laki</label>
        <br>
        <input type="radio" id="inputPerempuan" name="jenis_kelamin" value="Perempuan">
        <label for="inputPerempuan">Perempuan</label>
        <br><br>

        <!-- PRODI (SELECT) -->
        <label for="inputProdi">Program Studi:</label><br>
        <select id="inputProdi" name="prodi">
            <option value="informatika">Informatika</option>
            <option value="sistem_informasi">Sistem Informasi</option>
            <option value="teknik_industri">Teknik Industri</option>
        </select>
        <br><br>

        <!-- EMAIL -->
        <label for="inputEmail">Email:</label><br>
        <input type="email" id="inputEmail" name="email" placeholder="Masukkan Email">
        <br><br>

        <!-- ALASAN DAFTAR (TEXTAREA) -->
        <label for="inputAlasan">Alasan Mendaftar:</label><br>
        <textarea name="alasan" id="inputAlasan" rows="4" cols="30" placeholder="Masukkan Alasan Anda"></textarea>
        <br><br>

        <!-- SUBMIT BTN -->
        <input type="submit" value="Kirim">
        </form>
    </main>

</body>
</html>
