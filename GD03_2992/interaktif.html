<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktif Silvanus</title>
</head>
<body>
    <a href="profil.html" onclick="return confirm('Yakin pergi ke halaman Profil?')">PROFIL</a>
    <br>
    <a href="form.html" onclick="return confirm('Yakin pergi ke halaman Form?')">FORM</a>

    <h1 id="judulHalaman">HALAMAN INTERAKTIF</h1>    

    <p id="teks">Teks ini bisa berubah!</p>
    <button onclick="ubahBiru()">Ubah ke Biru</button>
    <br><br>

    <form>
        <label for="inputNama">Input Nama:</label><br>
        <input type="text" name="nama" id="inputNama">

        <button onclick="tampilkanNama()">Tampilkan</button>
    </form>
    <br>

    <form>
        <label for="inputAngka">Masukkan Angka untuk Hitung Kuadrat:</label><br>
        <input type="number" name="angka" id="inputAngka">

        <button onclick="hitungKuadrat()">Kirim</button>
    </form>

</body>

<script>
    const judulHalaman = document.getElementById("judulHalaman");
    judulHalaman.style.color = "red";
    console.log(judulHalaman.innerHTML);

    // FUNCTION
    function sapa(nama){
       console.log("Halo " + nama + "!"); 
    }
    console.log(sapa("Widi"));

    // UBAH TOMBOL
    function ubahBiru(){
        const teks = document.getElementById("teks");
        teks.style.color = "blue";
    }

    // INPUT NAMA
    function tampilkanNama(){
        const nama =  document.getElementById("inputNama").value;

        if(nama === ""){
            console.log(alert("Silakan isi nama dulu."));
        }else{
            console.log(alert("Halo, " + nama + "!"));
        }
    }

    // INPUT ANGKA (CARI KUADRAT)

    function hitungKuadrat(){
        const angka = document.getElementById("inputAngka").value;
        
        if(angka === ""){
            console.log(alert("Silakan isi angka dulu."));
        }else{
            console.log(alert("Hasil kuadrat dari " + angka + " adalah " + angka * angka));
        }
    }   
</script>
</html>
